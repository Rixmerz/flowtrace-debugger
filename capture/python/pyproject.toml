[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "flowtrace-runtime"
version = "2.0.0"
description = "FlowTrace v2 Python runtime — JSONL emitter and W3C trace context helpers"
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
# httpx and aiohttp are TEST-only. The runtime has zero required dependencies;
# patches.py imports them defensively and skips when absent. They are pinned here
# so tests/test_patches_httpclients.py actually runs in CI instead of quietly
# importorskip-ing itself — a silent skip is how the Java integration test stayed
# dead for an entire release.
dev = ["pytest>=7.4", "jsonschema>=4.21", "httpx>=0.27", "aiohttp>=3.9"]

[tool.setuptools.packages.find]
where = ["."]
include = ["flowtrace_runtime*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"
