[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "flowtrace-runtime"
version = "2.2.0"
description = "FlowTrace v2 Python capture layer — import hook, AST rewrite, JSONL emitter and W3C trace context helpers"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Juan Pablo Diaz (Rixmerz)" }]
requires-python = ">=3.9"
dependencies = []
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Debuggers",
]

[project.urls]
Homepage = "https://github.com/Rixmerz/flowtrace-debugger"
Repository = "https://github.com/Rixmerz/flowtrace-debugger"

[project.optional-dependencies]
dev = ["pytest>=7.4", "jsonschema>=4.21"]

[tool.setuptools.packages.find]
where = ["."]
include = ["flowtrace_runtime*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"
