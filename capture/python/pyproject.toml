[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "flowtrace-runtime"
version = "2.0.0"
description = "FlowTrace v2 Python runtime — JSONL emitter and W3C trace context helpers"
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.4", "jsonschema>=4.21"]

[tool.setuptools.packages.find]
where = ["."]
include = ["flowtrace_runtime*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"
