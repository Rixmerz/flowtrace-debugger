[package]
name = "flowtrace-rust"
description = "Builds a Cargo workspace with FlowTrace instrumentation spliced in, without touching its source"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
# The rewriter: parse a file, find function bodies, and read exact byte offsets.
syn = { version = "2", default-features = false, features = ["full", "parsing", "printing", "clone-impls", "visit"] }
proc-macro2 = { version = "1", features = ["span-locations"] }
quote = "1"
# `cargo metadata`.
serde_json = "1"

[dev-dependencies]
tempfile = "3"
