name: v2-ci

# Triggers on main. The previous form listened only on `v2/main`, but the v2
# work was merged into `main` and PRs target `main` — so for the whole period
# after that merge no job ran on any pull request. Two suites (mcp-server,
# dashboard) were failing that entire time without a single red check.
# v2/main is kept so pushes to the legacy integration branch still build.
on:
  push:
    branches: [main, v2/main]
  pull_request:
    branches: [main, v2/main]

env:
  PNPM_VERSION: '9'
  NODE_VERSION: '20'

jobs:
  # Schema validation + the golden regression diff. Everything else depends on
  # this: if the trace contract moved, the rest of the report is noise.
  golden:
    name: Golden fixtures (schema + regression)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install workspace deps
        run: pnpm install --frozen-lockfile

      - name: Build capture layers needed by the golden runners
        run: make build-java build-python

      - name: Validate fixtures against schema v2
        run: make validate-schema

      # STRICT: an unavailable fixture fails instead of skipping. A golden
      # check that silently skips every language is the failure mode this
      # whole job exists to prevent.
      - name: Golden regression check
        run: node scripts/check-golden.mjs
        env:
          FLOWTRACE_GOLDEN_STRICT: '1'

  java-tests:
    name: Java tests (JDK 17)
    runs-on: ubuntu-latest
    needs: golden
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      # test-java depends on build-java and sets -Dflowtrace.it.required=true,
      # so FlowtraceIntegrationTest can no longer assume itself away.
      - name: Build and test Java capture module
        run: make test-java

  python-tests:
    name: Python tests (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    needs: golden
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.9', '3.11', '3.13']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Build and test Python capture module
        run: make build-python test-python

  node-tests:
    name: Node tests (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    needs: golden
    strategy:
      fail-fast: false
      matrix:
        node-version: ['20', '22']
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - name: Install workspace deps
        run: pnpm install --frozen-lockfile

      - name: Test Node capture module
        run: make test-node

      # The TypeScript capture path was a silent no-op on Node >= 22.18 and
      # nothing caught it, because no job ever executed the ts fixture.
      - name: TypeScript golden fixture
        run: node scripts/check-golden.mjs ts
        env:
          FLOWTRACE_GOLDEN_STRICT: '1'

  # mcp-server and dashboard had no CI job at all. Both were red.
  consumers:
    name: MCP server + dashboard + CLI
    runs-on: ubuntu-latest
    needs: golden
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install workspace deps
        run: pnpm install --frozen-lockfile

      - name: MCP server
        run: make test-mcp

      - name: Dashboard
        run: make test-dashboard

      - name: CLI
        run: make test-cli

  # Guard against the class of bug that started all of this: a .gitignore rule
  # that silently swallows a file the build depends on.
  fixtures-committed:
    name: Golden fixtures are committed
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Every fixture must be tracked by git
        run: |
          missing=0
          for dir in java node ts python truncation/java truncation/node truncation/python; do
            f="examples/golden/$dir/expected.jsonl"
            if ! git ls-files --error-unmatch "$f" >/dev/null 2>&1; then
              echo "::error file=$f::$f is not tracked by git (check .gitignore)"
              missing=1
            fi
          done
          exit $missing

  bench:
    name: Benchmark harness (informational)
    runs-on: ubuntu-latest
    needs: golden
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install Python capture module
        run: make build-python

      - name: Run bench
        run: make bench

      - name: Upload bench results
        uses: actions/upload-artifact@v4
        with:
          name: bench-results
          path: benchmarks/results-*.json
          if-no-files-found: ignore
