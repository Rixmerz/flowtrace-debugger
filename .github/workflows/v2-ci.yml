name: v2-ci

# Triggers on main. The previous form listened only on `v2/main`, but the v2
# work was merged into `main` and PRs target `main` — so for the whole period
# after that merge no job ran on any pull request. Two suites (mcp-server,
# dashboard) were failing that entire time without a single red check.
# v2/main is kept so pushes to the legacy integration branch still build.
on:
  push:
    branches: [main, v2/main]
  pull_request:
    branches: [main, v2/main]

env:
  NODE_VERSION: '20'

jobs:
  # Schema validation + the golden regression diff. Everything else depends on
  # this: if the trace contract moved, the rest of the report is noise.
  golden:
    name: Golden fixtures (schema + regression)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # No `version:` here on purpose — pnpm/action-setup reads the pinned
      # version from the root package.json "packageManager" field, and
      # specifying both is a hard error (ERR_PNPM_BAD_PM_VERSION).
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Install workspace deps
        run: pnpm install --frozen-lockfile

      - name: Build capture layers needed by the golden runners
        run: make build-java build-python build-go

      - name: Validate fixtures against schema v2
        run: make validate-schema

      # STRICT: an unavailable fixture fails instead of skipping. A golden
      # check that silently skips every language is the failure mode this
      # whole job exists to prevent.
      - name: Golden regression check
        run: node scripts/check-golden.mjs
        env:
          FLOWTRACE_GOLDEN_STRICT: '1'

  # Matrix over JDKs, not a single version. The agent compiles to bytecode 11
  # so it can be loaded into old applications, but it is *loaded into whatever
  # JVM the user runs* — and a bytecode agent is exactly the kind of thing new
  # JVMs break: class file versions, stronger module encapsulation, changes to
  # the instrumentation API. Testing only on 17 left 21 and 25 (the current
  # LTS) completely unverified.
  java-tests:
    name: Java tests (JDK ${{ matrix.java-version }})
    runs-on: ubuntu-latest
    needs: golden
    strategy:
      fail-fast: false
      matrix:
        java-version: ['17', '21', '25']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.java-version }}
          distribution: 'temurin'
          cache: maven

      # test-java depends on build-java and sets -Dflowtrace.it.required=true,
      # so FlowtraceIntegrationTest can no longer assume itself away.
      - name: Build and test Java capture module
        run: make test-java

  python-tests:
    name: Python tests (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    needs: golden
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.9', '3.11', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Build and test Python capture module
        run: make build-python test-python

  node-tests:
    name: Node tests (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    needs: golden
    strategy:
      fail-fast: false
      matrix:
        # 20 left maintenance in April 2026; 24 is the current LTS and was
        # untested while the floor claim in every doc said 20.6+.
        node-version: ['20', '22', '24']
    steps:
      - uses: actions/checkout@v4

      # No `version:` here on purpose — pnpm/action-setup reads the pinned
      # version from the root package.json "packageManager" field, and
      # specifying both is a hard error (ERR_PNPM_BAD_PM_VERSION).
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - name: Install workspace deps
        run: pnpm install --frozen-lockfile

      - name: Test Node capture module
        run: make test-node

      # The TypeScript capture path was a silent no-op on Node >= 22.18 and
      # nothing caught it, because no job ever executed the ts fixture.
      - name: TypeScript golden fixture
        run: node scripts/check-golden.mjs ts
        env:
          FLOWTRACE_GOLDEN_STRICT: '1'

  go-tests:
    name: Go tests (Go ${{ matrix.go-version }})
    runs-on: ubuntu-latest
    needs: golden
    strategy:
      fail-fast: false
      matrix:
        # Floor is 1.24, not 1.21: runtime/pprof.labelMap (the type D3's
        # goroutine context propagation casts g.labels to) is
        # map[string]string before 1.24 and struct{ list []label } from 1.24
        # on — an entirely different memory layout. See D3 and "Risks
        # accepted" in docs/changes/2026-08-27-go-capture-layer.md.
        # The floor is 1.24 (see below) and the newest release is the one that
        # can break the //go:linkname into runtime/pprof, so both ends are tested.
        go-version: ['1.24', '1.25', '1.27']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}

      - name: Build and test Go capture module
        run: make build-go test-go

  # The browser capture layer plus its end-to-end test, which boots the real
  # dashboard collector and asserts that browser spans land on disk as valid
  # v2 JSONL. Neither half proves that on its own.
  browser-tests:
    name: Browser capture + collector e2e
    runs-on: ubuntu-latest
    needs: golden
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install workspace deps
        run: pnpm install --frozen-lockfile

      - name: Browser capture suite
        run: make test-browser

  # mcp-server and dashboard had no CI job at all. Both were red.
  consumers:
    name: MCP server + dashboard + CLI
    runs-on: ubuntu-latest
    needs: golden
    steps:
      - uses: actions/checkout@v4

      # No `version:` here on purpose — pnpm/action-setup reads the pinned
      # version from the root package.json "packageManager" field, and
      # specifying both is a hard error (ERR_PNPM_BAD_PM_VERSION).
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install workspace deps
        run: pnpm install --frozen-lockfile

      - name: MCP server
        run: make test-mcp

      - name: Dashboard
        run: make test-dashboard

      - name: CLI
        run: make test-cli

      # The docs gate exists because the prose has gone stale three times now
      # (a runtime row, a published package, an npx invocation the shim had
      # already abandoned). It was in `make test` but in no CI job, so it only
      # ever ran for a developer who ran the whole suite locally.
      - name: Docs restate the authoritative runtime list
        run: make check-docs

  # Guard against the class of bug that started all of this: a .gitignore rule
  # that silently swallows a file the build depends on.
  fixtures-committed:
    name: Golden fixtures are committed
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The fixture list comes from scripts/golden/runners.mjs rather than being
      # repeated here. It used to be a hardcoded bash array, which meant adding
      # a fixture to the registry silently left it unguarded by this job — the
      # exact drift the job exists to prevent.
      - name: Every fixture must be tracked by git
        run: |
          missing=0
          for dir in $(node -e "import('./scripts/golden/runners.mjs').then(m => console.log(m.FIXTURE_IDS.join(' ')))"); do
            f="examples/golden/$dir/expected.jsonl"
            if ! git ls-files --error-unmatch "$f" >/dev/null 2>&1; then
              echo "::error file=$f::$f is not tracked by git (check .gitignore)"
              missing=1
            fi
          done
          exit $missing

  # The plugin is the product for anyone who installs it from the marketplace,
  # and none of the jobs above touch it: every one of them runs from a checkout
  # with node_modules installed, which is the one environment where a broken
  # plugin still appears to work. This job rebuilds the bundle, proves it did
  # not drift from mcp-server/src, and boots it in an empty directory.
  plugin:
    name: Plugin is installable
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install workspace deps
        run: pnpm install --frozen-lockfile

      # Rebuilds plugin/mcp/server.bundle.js and fails if the committed copy is
      # stale, then validates manifests, paths and a standalone boot.
      - name: Bundle is current and the plugin boots standalone
        run: make check-bundle

  lint:
    name: Lint and formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Install workspace deps
        run: pnpm install --frozen-lockfile

      - name: ESLint
        run: pnpm run lint

      # transform/testdata/ is excluded at the source: those files are
      # byte-spliced transformer output plus one deliberately unparseable
      # fixture, so gofmt neither can nor should touch them.
      - name: gofmt
        run: |
          cd capture/go
          unformatted=$(find . -name '*.go' -not -path './transform/testdata/*' -print0 | xargs -0 gofmt -l)
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt would change these files:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: cd capture/go && go vet ./...

  bench:
    name: Benchmark harness (informational)
    runs-on: ubuntu-latest
    needs: golden
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      # All three layers, not just Python: without the Java agent jar and the
      # Node capture module the harness measures the baseline against itself
      # and reports 0% overhead for a run that never instrumented anything.
      - name: Build the capture layers being measured
        run: make build-java build-python build-node

      - name: Run bench
        run: make bench

      - name: Upload bench results
        uses: actions/upload-artifact@v4
        with:
          name: bench-results
          path: benchmarks/results-*.json
          if-no-files-found: ignore
