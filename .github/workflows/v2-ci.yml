name: v2-ci

# v2/main was merged into main (b48824b) and deleted as an active branch, so
# these triggers matched nothing and the whole workflow silently stopped
# running. Kept v2/main listed so any lingering branch still gets checked.
on:
  push:
    branches: [main, v2/main]
  pull_request:
    branches: [main, v2/main]

jobs:
  validate-schema:
    name: Validate golden fixtures vs schema v2
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Ajv (scripts/)
        working-directory: scripts
        run: npm install --no-audit --no-fund

      - name: Run schema validation
        run: make validate-schema

  golden-verify:
    name: Golden fixtures reproduce
    runs-on: ubuntu-latest
    needs: validate-schema
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # golden-verify runs every capture layer for real, so all three
      # toolchains must be present. A missing one is reported as SKIP and
      # counted, never silently passed.
      - name: Build capture layers
        run: make build-java build-python build-node

      - name: Verify golden fixtures reproduce
        run: make golden-verify

      # Same job because it needs the same three toolchains already built above.
      - name: Verify truncation parity across layers
        run: make truncation-parity

  java-tests:
    name: Java tests (JDK 17)
    runs-on: ubuntu-latest
    needs: validate-schema
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build and test Java capture module
        run: make build-java test-java

  python-tests:
    name: Python tests (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    needs: validate-schema
    strategy:
      matrix:
        python-version: ['3.9', '3.11', '3.13']
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Build and test Python capture module
        run: make build-python test-python

  node-tests:
    name: Node tests (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    needs: validate-schema
    strategy:
      matrix:
        node-version: ['20', '22']
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install pnpm deps (no frozen lockfile)
        working-directory: capture/node
        run: pnpm install --no-frozen-lockfile

      - name: Build and test Node capture module
        run: make test-node

  cli-tests:
    name: CLI tests
    runs-on: ubuntu-latest
    needs: validate-schema
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install CLI deps
        working-directory: flowtrace-cli
        run: npm install --no-audit --no-fund

      - name: Run CLI tests
        run: |
          cd flowtrace-cli && for t in test/test-cli.js test/test-cli-java.js test/test-cli-python.js test/test-cli-node.js test/test-detect.js test/test-cli-autodetect.js test/test-analyze.js test/test-run-passthrough.js test/test-gitignore.js test/test-analyze-dashboard.js; do
            node $t || exit 1
          done

  mcp-server-tests:
    name: MCP server tests
    runs-on: ubuntu-latest
    needs: validate-schema
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # There was no mcp-server job: its tests ran only via `make test`, which
      # needs a `tsc` build first. So when the golden fixtures grew an error path
      # in a later change, two mcp-server tests broke and nothing reported it.
      - name: Install and build
        working-directory: mcp-server
        run: |
          npm install --no-audit --no-fund
          npm run build

      - name: Run MCP server tests
        working-directory: mcp-server
        run: |
          node test/test-trace-tools.mjs
          node test/test-diagnose.mjs

  dashboard-tests:
    name: Dashboard consumer tests
    runs-on: ubuntu-latest
    needs: validate-schema
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # test-v2-field-names.js captures a real trace through the CLI, so the Node
      # capture layer has to be installed too.
      - name: Install deps
        run: |
          make build-node
          cd flowtrace-dashboard && npm install --no-audit --no-fund
          cd ../flowtrace-cli && npm install --no-audit --no-fund

      # There was no dashboard job at all: these ran only via `make test`, so the
      # consumers reading v1 field names while the analyzer emitted v2 went
      # unnoticed through an entire release.
      - name: Run dashboard tests
        run: |
          cd flowtrace-dashboard
          node test/test-analyzer.js
          node test/test-v2-field-names.js

  bench:
    name: Benchmark harness (informational)
    runs-on: ubuntu-latest
    needs: validate-schema
    # No longer continue-on-error: the harness now fails when an instrumented run
    # emits zero events, which is a real defect (broken agent wiring, unset
    # prefix) and must not be swallowed. The per-event gates carry 2-4x headroom
    # over measured values so runner jitter cannot trip them.
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build all capture layers
        run: make build-java build-python build-node

      - name: Run bench
        run: make bench

      - name: Upload bench results
        uses: actions/upload-artifact@v4
        with:
          name: bench-results
          path: benchmarks/results-*.json
          if-no-files-found: ignore
