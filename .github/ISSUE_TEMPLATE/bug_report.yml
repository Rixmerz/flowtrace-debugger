name: Bug Report
description: Report a bug or issue with FlowTrace Debugger
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this bug report!

  - type: dropdown
    id: component
    attributes:
      label: Component
      description: Which component is affected?
      options:
        - Java capture layer
        - Python capture layer
        - Node.js / TypeScript capture layer
        - Go capture layer
        - Browser capture layer (@rixmerz/flowtrace-browser)
        - CLI (@rixmerz/flowtrace)
        - MCP server
        - Dashboard
        - Claude Code plugin
        - Schema / golden fixtures
        - Documentation
        - Build / CI
        - Other
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Describe the bug
      description: A clear and concise description of what the bug is.
      placeholder: Tell us what you see!
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Steps to reproduce the behavior
      placeholder: |
        1. Go to '...'
        2. Run command '...'
        3. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: A clear and concise description of what you expected to happen.
    validations:
      required: true

  - type: input
    id: prefix
    attributes:
      label: Package prefix used
      description: >
        The value of --package-prefix / FLOWTRACE_PACKAGE_PREFIX. A wrong prefix
        is the single most common cause of an empty or enormous trace, so this
        is the first thing anyone triaging will ask for.
      placeholder: "com.acme.orders  /  myapp  /  github.com/acme/svc  /  /home/me/project"
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Please provide your environment details
      placeholder: |
        - OS: [e.g. macOS 15, Ubuntu 24.04, Windows 11]
        - FlowTrace version: [flowtrace --version, e.g. 3.4.0]
        - Node.js version: [e.g. 22.11.0 — the CLI needs 20.6+]
        - Java / Python / Go version, if relevant: [e.g. JDK 21, Python 3.12, Go 1.25]
    validations:
      required: true

  - type: textarea
    id: trace
    attributes:
      label: First lines of the trace
      description: >
        The first ~20 lines of the .jsonl, or "the file is empty". **Read it
        first** — a trace contains your arguments and return values.
      render: shell

  - type: textarea
    id: logs
    attributes:
      label: Relevant log output
      description: Please copy and paste any relevant log output. This will be automatically formatted into code.
      render: shell

  - type: checkboxes
    id: terms
    attributes:
      label: Code of Conduct
      description: By submitting this issue, you agree to follow our [Code of Conduct](https://github.com/Rixmerz/flowtrace-debugger/blob/main/CODE_OF_CONDUCT.md)
      options:
        - label: I agree to follow this project's Code of Conduct
          required: true
